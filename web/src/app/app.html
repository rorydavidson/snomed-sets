<app-navbar title="SNOMED CT value sets" [session]="session.state()" (signOut)="session.signOut()" />

@switch (session.state().status) {
  @case ('loading') {
    <main class="page"><p class="muted" role="status">Loading…</p></main>
  }
  @case ('error') {
    <main class="page">
      <div class="error-panel" role="alert">
        <h1>We could not reach the service</h1>
        <p>Check your connection and reload the page.</p>
      </div>
    </main>
  }
  @default {
    <!-- Signed in, or browsing the published library without signing in. -->
    <router-outlet />
  }
}

<app-site-footer />
