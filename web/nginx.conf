# If something in front of this container already terminated TLS, keep its scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The API, sign-in and sign-out all live in the backend. Serving them from this origin
    # keeps the session cookie first-party. /login and its stylesheet are the Keycloak
    # callback and, in development only, the local sign-in form.
    location ~ ^/(api|oauth2|sign-in|login|logout|default-ui\.css)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the Angular app; unknown paths fall back to it for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
