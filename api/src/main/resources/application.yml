spring:
  application:
    name: valuesets-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # The dev profile's sample data is a repeatable migration in another folder. A database that
    # once ran with dev has it recorded, and without dev it cannot be found, which Flyway would
    # refuse. Versioned migrations are still checked strictly.
    ignore-migration-patterns: "*:future,repeatable:missing"
  servlet:
    multipart:
      # Profile pictures are the only uploads.
      max-file-size: 1MB
      max-request-size: 1100KB
  mvc:
    # Errors are sent as problem details, whose "detail" field the frontend shows to the user.
    problemdetails:
      enabled: true
  http:
    clients:
      # Applies to the Snowstorm client: fail fast rather than hold a request thread.
      connect-timeout: 5s
      read-timeout: 30s

server:
  # The app sits behind the web container's proxy, so redirect URIs must use the forwarded host.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Sent over HTTPS only. Behind a proxy that ends TLS the application itself sees plain
        # HTTP, so this cannot be worked out per request. Set SESSION_COOKIE_SECURE=false only to
        # sign in over plain HTTP from another machine; browsers accept it on http://localhost.
        secure: ${SESSION_COOKIE_SECURE:true}

snowstorm:
  # No default: the public Snowstorm refuses server-side calls, so an instance must be chosen.
  base-url: ${SNOWSTORM_BASE_URL}
  user-agent: ${SNOWSTORM_USER_AGENT:snomed-value-sets-bff}

messages:
  # Messages to value set owners are sent through Resend. Messaging is switched off, and the
  # "Message owner" button hidden, unless the API key, sender address and app URL are all set.
  resend-api-key: ${RESEND_API_KEY:}
  # A sender on a domain verified in Resend, for example "SNOMED CT value sets <no-reply@example.org>".
  from: ${MESSAGES_FROM:}
  resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
  # The public address of this application, for the links in emails. Configured, never taken from
  # a request, so nobody can change where links in someone else's email point.
  app-url: ${APP_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health

---
# Sign-in through Keycloak, unless the development-only local sign-in is switched on.
spring:
  config:
    activate:
      on-profile: "!local-login"
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            # The email scope is only used for messages between people: the address is stored
            # when someone lets others message them, and is never sent to anyone's browser.
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

---
# Development only: one local user instead of Keycloak. See LocalLoginConfig.
spring:
  config:
    activate:
      on-profile: local-login

local-login:
  username: ${LOCAL_LOGIN_USERNAME}
  password: ${LOCAL_LOGIN_PASSWORD}
  # Optional, so messaging can be tried locally. Treated as the local user's verified address.
  email: ${LOCAL_LOGIN_EMAIL:}
