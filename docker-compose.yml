services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-valuesets}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-valuesets}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Keycloak is needed unless the development-only local-login profile is on.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      LOCAL_LOGIN_USERNAME: ${LOCAL_LOGIN_USERNAME:-}
      LOCAL_LOGIN_PASSWORD: ${LOCAL_LOGIN_PASSWORD:-}
      LOCAL_LOGIN_EMAIL: ${LOCAL_LOGIN_EMAIL:-}
      # Messages to value set owners, sent through Resend. Off unless all three are set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MESSAGES_FROM: ${MESSAGES_FROM:-}
      APP_URL: ${APP_URL:-}
      SNOWSTORM_BASE_URL: ${SNOWSTORM_BASE_URL:-http://host.docker.internal:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    # Lets the container reach a Snowstorm running on this machine as host.docker.internal,
    # on Linux as well as on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./web
    ports:
      # 8090 by default because 8080 is the usual port for a local Snowstorm.
      - "${WEB_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Optional local Snowstorm, following the compose file in the Snowstorm repository.
  # Start with: docker compose --profile local-snowstorm up
  # and set SNOWSTORM_BASE_URL=http://snowstorm:8080 in .env.
  # It starts empty: a SNOMED CT release must be imported before it returns concepts.
  elasticsearch:
    profiles: ["local-snowstorm"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      node.name: snowstorm
      cluster.name: snowstorm-cluster
      ES_JAVA_OPTS: -Xms4g -Xmx4g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 5s
      timeout: 5s
      retries: 60

  snowstorm:
    profiles: ["local-snowstorm"]
    image: snomedinternational/snowstorm:latest
    # The image's own entrypoint is kept, because its layout changes between releases (it no
    # longer contains a single jar). The java launcher picks these options up from the environment.
    environment:
      JDK_JAVA_OPTIONS: -Xms2g -Xmx4g --add-opens=java.base/java.util=ALL-UNNAMED
    command:
      - --elasticsearch.urls=http://elasticsearch:9200
    # Snowstorm has no authentication of its own, so it is published on this machine only.
    # The port is there for importing a release from the host.
    ports:
      - "127.0.0.1:${SNOWSTORM_PORT:-8081}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  db-data:
  es-data:
